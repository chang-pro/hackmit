<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ReLoop</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html { height: 100%; }
  /* The page scrolls. A fixed-height centred flex box clipped the item list
     and the approve panel off the bottom of the screen as soon as a scan
     found more than a few things. */
  body {
    min-height: 100%; margin: 0;
    display: flex; align-items: flex-start; justify-content: center; gap: 1.5rem;
    /* Bottom clearance so the fixed agent banner never covers the last row. */
    padding: 1.25rem 1.25rem 5.5rem; background: #0b0d12; color: #e7ecf5; flex-wrap: wrap;
    font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* The feed stays put while the sidebar scrolls past it. */
  #stage { position: sticky; top: 1.25rem; line-height: 0; }
  #shot { max-width: min(92vw, 720px); max-height: 82vh; border-radius: 12px; background: #141821; }
  #shot[hidden] { display: none; }
  #boxes { position: absolute; inset: 0; pointer-events: none; }
  .box { position: absolute; border: 2px solid var(--c); border-radius: 6px; background: color-mix(in srgb, var(--c) 12%, transparent); }
  .tag {
    position: absolute; left: -2px; top: -1.45rem; padding: .1rem .4rem;
    border-radius: 5px; background: var(--c); color: #06080c;
    font: 700 11px ui-monospace, monospace; white-space: nowrap;
  }
  aside { flex: 1 1 18rem; min-width: 15rem; max-width: 22rem; }
  /* Long scans scroll inside the list instead of off the screen. */
  #list { max-height: 34vh; overflow: auto; }
  #total { font: 700 3rem/1 ui-monospace, monospace; letter-spacing: -.04em; }
  #cap { margin-top: .2rem; color: #7d8aa3; font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; }
  #list { margin-top: 1rem; display: flex; flex-direction: column; gap: .35rem; }
  .row { display: flex; justify-content: space-between; gap: .8rem; border-top: 1px solid #222838; padding-top: .35rem; }
  .row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .p { color: #55e39b; font-weight: 700; }
  #msg { margin-top: .8rem; line-height: 1.6; color: #9aa6bd; font-size: .78rem; }
  #bar { margin-top: 1.1rem; display: flex; gap: 1rem; flex-wrap: wrap; color: #7d8aa3; font-size: .72rem; }
  .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #6b7689; display: inline-block; }
  .dot.live { background: #55e39b; box-shadow: 0 0 9px #55e39b88; }
  .dot.stale { background: #ffcf6b; }
  b { color: #e7ecf5; }

  /* Approve panel: priced -> plan -> approve -> live on Shopify. */
  button { font: inherit; color: #e7ecf5; background: #1a1f2c; border: 1px solid #2c3446;
           border-radius: 8px; padding: .45rem .7rem; cursor: pointer; }
  button:hover:not(:disabled) { background: #232a3a; border-color: #3d4761; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.go { background: #55e39b; border-color: #55e39b; color: #06251a; font-weight: 700; }
  button.go:hover:not(:disabled) { background: #6cf0ab; }
  #panel { margin-top: 1.1rem; border-top: 1px solid #222838; padding-top: .9rem; }
  .eyebrow { color: #7d8aa3; font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: .5rem; }
  #goals { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .6rem; }
  #goals button.on { background: #2b3550; border-color: #55e39b; }
  .acts { display: flex; gap: .4rem; flex-wrap: wrap; }
  #plan { margin-top: .8rem; display: flex; flex-direction: column; gap: .5rem; max-height: 40vh; overflow: auto; }
  .d { border-left: 3px solid var(--c, #3d4761); padding: .3rem 0 .3rem .5rem; }
  .d .h { display: flex; justify-content: space-between; gap: .6rem; }
  .d .why { color: #7d8aa3; font-size: .7rem; line-height: 1.45; margin-top: .15rem; }
  .d a { color: #55e39b; font-size: .7rem; }
  .d .st { font-size: .7rem; color: #9aa6bd; }
  .d.off { opacity: .45; }
  .d .h { align-items: baseline; }
  .pick { flex: 1; display: flex; align-items: baseline; gap: .45rem; background: none;
          border: 0; padding: 0; text-align: left; color: inherit; font: inherit; }
  .pick .tick { flex: none; width: 1.05rem; height: 1.05rem; border: 1px solid #3d4761;
                border-radius: 4px; display: grid; place-items: center; font-size: .7rem; color: #06251a; }
  .d:not(.off) .pick .tick { background: #55e39b; border-color: #55e39b; }
  .tot { display: flex; justify-content: space-between; border-top: 1px solid #222838; padding-top: .45rem; font-weight: 700; }
  #confirm { margin-top: .9rem; border-top: 1px solid #222838; padding-top: .8rem; }
  #confirmText { font-size: .82rem; line-height: 1.5; margin-bottom: .6rem; }
  #confirmText b { color: #55e39b; }
  .confirm-acts { display: flex; gap: .5rem; }
  .confirm-acts button { flex: 1; padding: .6rem; }
</style>
</head>
<body>
  <div id="stage">
    <img id="shot" alt="Newest frame from the glasses" hidden />
    <div id="boxes"></div>
  </div>

  <aside>
    <div id="total">$0</div>
    <div id="cap">estimated resale value</div>
    <div id="list"></div>
    <div id="pricingSources" style="font-size:12px;line-height:1.5;margin-top:12px"></div>
    <div id="bar">
      <span><span class="dot" id="dot"></span> <span id="state">no frames</span></span>
      <span>age <b id="age">—</b></span>
      <span>fps <b id="fps">—</b></span>
      <span>priced <b id="pAge">—</b></span>
    </div>
    <div id="msg"></div>

    <section id="panel">
      <div class="eyebrow">Goal</div>
      <div id="goals"></div>
      <div class="acts">
        <button id="analyze" type="button">Start pricing</button>
        <button id="makePlan" type="button">Review these items</button>
        <a href="/dashboard" style="align-self:center;color:#55e39b;font-size:.72rem">Dashboard</a>
      </div>
      <div id="plan"></div>

      <!-- The decision, spelled out: what will happen, to how many things, for
           how much, and an equally available way to say no. -->
      <div id="confirm" hidden>
        <div id="confirmText"></div>
        <div class="confirm-acts">
          <button id="approve" class="go" type="button">Yes, list them</button>
          <button id="cancel" type="button">Not now</button>
        </div>
      </div>
    </section>
  </aside>

<script>
// The whole product on one page: the glasses feed, and a price on everything
// in it. The app POSTs JPEG frames to /api/frames over plain HTTP and this
// polls the newest one — no WebRTC, no signalling, no ICE, no TURN, and no
// HTTPS requirement, because nothing here touches getUserMedia.
const POLL_MS = 100;
const ITEM_POLL_MS = 1000;
const $ = (id) => document.getElementById(id);
let lastId = null, stamps = [];

function colorFor(usd) {
  return usd >= 100 ? "#55e39b" : usd >= 25 ? "#ffcf6b" : "#9fb0d5";
}

async function pollFrame() {
  try {
    const meta = await (await fetch("/api/live-frame", { cache: "no-store" })).json();
    if (meta.error) {
      $("state").textContent = "no frames yet";
      $("dot").className = "dot";
      $("msg").textContent =
        "Server is up and listening, but no frame has arrived. Start the stream in the app.";
      return;
    }
    const frame = meta.frame || {};
    const ageMs = meta.age_ms ?? 0;
    $("age").textContent = ageMs < 1000 ? ageMs + "ms" : Math.round(ageMs / 1000) + "s";
    // A frame older than a few seconds means the stream stopped, which has a
    // different cause than one that never started.
    const live = ageMs < 4000;
    $("dot").className = "dot " + (live ? "live" : "stale");
    $("state").textContent = live ? "live" : "stalled";
    $("msg").textContent = "";

    if (frame.frame_id && frame.frame_id !== lastId) {
      lastId = frame.frame_id;
      const now = performance.now();
      stamps = stamps.filter((t) => now - t < 5000).concat(now);
      if (stamps.length > 1) {
        $("fps").textContent = (((stamps.length - 1) * 1000) / (now - stamps[0])).toFixed(1);
      }
      // Safari reuses an identical <img> URL even with no-store, so the frame
      // id doubles as the cache key.
      $("shot").src = "/api/live-frame/image?frame_id=" + encodeURIComponent(frame.frame_id);
      $("shot").hidden = false;
    }
  } catch (err) {
    $("state").textContent = "server unreachable";
    $("dot").className = "dot";
    $("msg").textContent = "Cannot reach the server: " + err.message;
  }
}

async function pollItems() {
  let data;
  try {
    data = await (await fetch("/api/items/latest", { cache: "no-store" })).json();
  } catch { return; }

  if (data.error || !Array.isArray(data.items)) {
    $("pricingSources").replaceChildren();
    delete $("pricingSources").dataset.result;
    // A failing model is worth saying out loud rather than showing an empty
    // list that looks like "nothing here is worth anything".
    $("pAge").textContent = data?.queue?.last_error ? "error" : "—";
    if (data?.queue?.last_error) $("msg").textContent = "Pricing error: " + data.queue.last_error;
    return;
  }
  const refs = $("pricingSources");
  if (refs.dataset.result !== data.generated_at) {
    refs.dataset.result = data.generated_at;
    refs.replaceChildren();
    for (const warning of data.warnings ?? []) {
      const p = document.createElement("p"); p.textContent = warning; refs.append(p);
    }
    for (const source of data.sources ?? []) {
      if (!/^https?:\/\//.test(source.url)) continue;
      const a = document.createElement("a");
      a.href = source.url; a.textContent = source.title || "Source";
      a.target = "_blank"; a.rel = "noopener noreferrer";
      a.style.cssText = "color:#a7dcff;display:block"; refs.append(a);
    }
    const html = data.grounding_metadata?.searchEntryPoint?.renderedContent;
    if (html) {
      const f = document.createElement("iframe");
      f.title = "Google Search suggestions";
      f.setAttribute("sandbox", "allow-popups allow-popups-to-escape-sandbox");
      f.srcdoc = html; f.style.cssText = "width:100%;border:0"; refs.append(f);
    }
  }
  const items = data.items;
  $("total").textContent = "$" + (data.total_value_usd ?? 0);
  const generatedMs = Date.now() - (Date.parse(data.generated_at) || Date.now());
  $("pAge").textContent = Math.round(generatedMs / 1000) + "s ago";

  $("list").replaceChildren(...items.map((it) => {
    const row = document.createElement("div");
    row.className = "row";
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = it.label;
    row.title = it.price_basis || "Estimated resale value";
    const p = document.createElement("span");
    p.className = "p";
    p.textContent = "$" + it.price_usd;
    row.append(n, p);
    return row;
  }));

  // Boxes are in the model's 0..1000 space, measured on a frame from this same
  // feed, so they map straight onto the image as percentages — no letterboxing
  // maths, and no chance of drawing them over a different video source.
  $("boxes").replaceChildren(...items.map((it) => {
    const b = document.createElement("div");
    b.className = "box";
    b.style.setProperty("--c", colorFor(it.price_usd));
    b.style.left = (it.bbox.x / 10) + "%";
    b.style.top = (it.bbox.y / 10) + "%";
    b.style.width = (it.bbox.width / 10) + "%";
    b.style.height = (it.bbox.height / 10) + "%";
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = it.label.toUpperCase() + "  $" + it.price_usd;
    b.append(tag);
    return b;
  }));
}

pollFrame(); pollItems();
setInterval(pollFrame, POLL_MS);
setInterval(pollItems, ITEM_POLL_MS);
</script>

<!-- Approve panel. The camera sees and prices; this is where a person decides.
     Nothing is listed anywhere until Approve is tapped (plan v2 §2), and
     approval both lists in the ReLoop store and publishes live to Shopify. -->
<script>
(() => {
  const el = (id) => document.getElementById(id);
  const usd = (n) => `$${Math.round(Number(n) || 0).toLocaleString("en-US")}`;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const ACTION_COLOR = { SELL: "#55e39b", DONATE: "#79c8ff", RECYCLE: "#ffcf6b", KEEP: "#9fb0d5" };
  const GOALS = [
    { id: "cash", label: "$300 cash", goal: { mode: "CASH", targetUsd: 300 } },
    { id: "zero", label: "Waste nothing", goal: { mode: "ZERO_WASTE", targetUsd: 300 } },
    { id: "clear", label: "Clear out fast", goal: { mode: "CLEAR_OUT" } },
  ];
  let chosen = GOALS[0];
  let plan = null;
  let pricingOn = false;

  el("goals").innerHTML = GOALS.map((g) => `<button type="button" data-goal="${g.id}">${esc(g.label)}</button>`).join("");
  function paintGoals() {
    for (const b of el("goals").children) b.classList.toggle("on", b.dataset.goal === chosen.id);
  }
  el("goals").addEventListener("click", (e) => {
    const id = e.target.closest("button")?.dataset.goal;
    if (!id) return;
    chosen = GOALS.find((g) => g.id === id);
    paintGoals();
  });
  paintGoals();

  async function api(path, body) {
    const res = await fetch(path, body
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
      : { method: "POST" });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
    return json;
  }

  // Pricing is off until someone asks for it, so no frame reaches a model
  // unasked. This button is that ask -- it used to need a terminal.
  async function refreshAnalyze() {
    try {
      const status = await (await fetch("/api/analysis/status", { cache: "no-store" })).json();
      pricingOn = status.analysis_enabled === true;
    } catch { /* the status bar already reports an unreachable server */ }
    el("analyze").textContent = pricingOn ? "Stop pricing" : "Start pricing";
  }
  el("analyze").addEventListener("click", async () => {
    el("analyze").disabled = true;
    try {
      await api(pricingOn ? "/api/analysis/stop" : "/api/analysis/start");
      pricingOn = !pricingOn;
    } catch (err) {
      el("msg").textContent = err.message;
    } finally {
      el("analyze").disabled = false;
      refreshAnalyze();
    }
  });
  refreshAnalyze();

  // Items the person unticked. They are sent as keep_item_ids and never listed.
  const kept = new Set();

  function renderPlan() {
    const rows = plan.decisions.map((d) => {
      const off = kept.has(d.itemId);
      const price = d.action === "SELL" ? usd(d.listUsd) : d.action.toLowerCase();
      return `<div class="d${off ? " off" : ""}" style="--c:${ACTION_COLOR[d.action] ?? "#3d4761"}" data-item="${esc(d.itemId)}">
        <div class="h">
          <button class="pick" type="button" data-pick="${esc(d.itemId)}"
                  aria-pressed="${off ? "false" : "true"}"
                  title="${off ? "Keep this item" : "Include this item"}">
            <span class="tick" aria-hidden="true">${off ? "" : "✓"}</span>
            <span>${esc(d.label ?? d.itemId)}</span>
          </button>
          <span>${off ? "keeping" : price}</span>
        </div>
        ${d.reason ? `<div class="why">${esc(d.reason)}</div>` : ""}
        <div class="st"></div>
      </div>`;
    }).join("");
    el("plan").innerHTML = rows;
    renderConfirm();
  }

  function renderConfirm() {
    if (!plan || plan.approved) {
      el("confirm").hidden = true;
      return;
    }
    const live = plan.decisions.filter((d) => !kept.has(d.itemId));
    const sell = live.filter((d) => d.action === "SELL");
    const other = live.filter((d) => ["DONATE", "RECYCLE"].includes(d.action));
    const total = sell.reduce((sum, d) => sum + (d.listUsd ?? 0), 0);
    const bits = [`put <b>${sell.length} item${sell.length === 1 ? "" : "s"}</b> up for sale, asking <b>${usd(total)}</b>`];
    if (other.length) bits.push(`and set ${other.length} aside to donate or recycle`);
    el("confirmText").innerHTML = sell.length || other.length
      ? `This will ${bits.join(" ")}. Untick anything you want to keep.`
      : `Nothing is selected. Tick at least one item, or come back later.`;
    el("approve").disabled = sell.length === 0 && other.length === 0;
    el("approve").textContent = sell.length ? `Yes, list ${sell.length}` : "Yes, go ahead";
    el("confirm").hidden = false;
  }

  el("plan").addEventListener("click", (e) => {
    const id = e.target.closest("[data-pick]")?.dataset.pick;
    if (!id || !plan || plan.approved) return;
    if (kept.has(id)) kept.delete(id); else kept.add(id);
    renderPlan();
  });

  el("cancel").addEventListener("click", () => {
    plan = null;
    kept.clear();
    el("plan").innerHTML = "";
    el("confirm").hidden = true;
  });

  el("makePlan").addEventListener("click", async () => {
    el("makePlan").disabled = true;
    el("plan").innerHTML = `<div class="why">Planning…</div>`;
    try {
      plan = await api("/api/plans", { goal: chosen.goal });
      kept.clear();
      renderPlan();
    } catch (err) {
      plan = null;
      el("confirm").hidden = true;
      el("plan").innerHTML = `<div class="why">${esc(err.message)}</div>`;
    } finally {
      el("makePlan").disabled = false;
    }
  });

  el("approve").addEventListener("click", async () => {
    if (!plan) return;
    el("approve").disabled = true;
    el("approve").textContent = "Listing…";
    try {
      // The phone knows where it is; Marketplace drafts need it, and Shopify
      // ignores it. Approval must not wait on a location prompt.
      const location = await new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        const done = setTimeout(() => resolve(null), 3000);
        navigator.geolocation.getCurrentPosition(
          (p) => { clearTimeout(done); resolve({ lat: p.coords.latitude, lon: p.coords.longitude }); },
          () => { clearTimeout(done); resolve(null); },
          { timeout: 3000 }
        );
      });
      const result = await api(`/api/plans/${encodeURIComponent(plan.id)}/approve`, {
        location,
        keep_item_ids: [...kept],
      });
      plan.approved = true;
      el("confirm").hidden = true;
      trackListings(result.listings.map((l) => l.id));
    } catch (err) {
      el("msg").textContent = err.message;
      el("approve").disabled = false;
      renderConfirm();
    }
  });

  // Publishing happens after approval returns, so each card polls its listing
  // until it is live (or failed) and then shows the product link.
  function trackListings(ids) {
    for (const id of ids) pollListing(id, 0);
  }
  async function pollListing(id, attempt) {
    let listing;
    try {
      listing = await (await fetch(`/api/listings/${encodeURIComponent(id)}`, { cache: "no-store" })).json();
    } catch { return; }
    const card = el("plan").querySelector(`[data-item="${CSS.escape(listing.itemId ?? "")}"] .st`);
    const shop = listing.shopify ?? {};
    if (card) {
      if (shop.status === "live") {
        card.innerHTML = shop.url
          ? `live · <a href="${esc(shop.url)}" target="_blank" rel="noopener">open listing</a>${shop.dryRun ? " (dry run)" : ""}`
          : `live${shop.dryRun ? " (dry run)" : ""}`;
      } else if (shop.status === "failed") {
        card.textContent = `not listed: ${shop.error ?? "unknown error"}`;
      } else {
        card.textContent = "listing…";
      }
      if (listing.marketplace?.status === "drafted") {
        card.innerHTML += listing.marketplace.url
          ? ` · <a href="${esc(listing.marketplace.url)}" target="_blank" rel="noopener">Marketplace draft</a>`
          : " · Marketplace draft ready";
      }
    }
    const settled = ["live", "failed"].includes(shop.status) &&
      ["off", "drafted", "failed"].includes(listing.marketplace?.status);
    if (!settled && attempt < 60) setTimeout(() => pollListing(id, attempt + 1), 2000);
  }
})();
</script>

<!-- Live agent updates from the event log: the "keeps working" moment is
     visible here even after the phone is put away. Standalone, so it cannot
     break the feed above. Full view at /dashboard. -->
<style>
  .agent-live { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    display: none; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px;
    background: rgba(32,38,58,.92); color: #fff; font: 500 14px/1.35 system-ui, sans-serif;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 50; }
  .agent-live.show { display: flex; }
  .agent-live b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .agent-live span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .agent-live a { color: #a7dcff; font-size: 13px; white-space: nowrap; }
</style>
<div class="agent-live" id="agent-live" role="status" aria-live="polite"><span id="agent-text"></span><b id="agent-total"></b><a href="/dashboard">Dashboard</a></div>
<script type="module">
  import { foldDashboard } from "/dashboard-fold.js";
  let events = [];
  const box = document.getElementById("agent-live");
  function show(latest) {
    const d = foldDashboard(events);
    if (!latest?.text) return;
    document.getElementById("agent-text").textContent = latest.text;
    document.getElementById("agent-total").textContent =
      d.goal.targetUsd ? `$${d.recoveredUsd} · $${d.goalGapUsd} to go` : d.recoveredUsd ? `$${d.recoveredUsd}` : "";
    box.classList.add("show");
    if (latest.kind === "SOLD" && "speechSynthesis" in window) {
      speechSynthesis.speak(new SpeechSynthesisUtterance(
        `${latest.text}.${d.goal.targetUsd ? ` ${d.goalGapUsd} dollars to go.` : ""}`));
    }
  }
  const source = new EventSource("/api/events/stream");
  source.addEventListener("snapshot", (msg) => {
    events = JSON.parse(msg.data);
    show([...events].reverse().find((e) => e.text));
  });
  source.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    events = event.kind === "RESET" ? [] : [...events, event];
    if (event.kind === "RESET") box.classList.remove("show");
    show(event);
  };
</script>
</body>
</html>
