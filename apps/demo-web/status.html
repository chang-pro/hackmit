<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LOS — Listing status</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 1.25rem 1.25rem 3rem;
    background: #0b0d12; color: #e7ecf5;
    font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  main { max-width: 70rem; margin: 0 auto; }
  a { color: #55e39b; }
  h1 { font-size: 1.1rem; margin: 0; font-weight: 700; }
  .sub { color: #7d8aa3; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
  header { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: .9rem; }
  .totals { display: flex; gap: 1.3rem; flex-wrap: wrap; margin-left: auto; color: #9aa6bd; font-size: .72rem; }
  .totals b { display: block; color: #e7ecf5; font-size: 1.3rem; font-weight: 700; }
  .totals .warn b { color: #ffcf6b; }

  button { font: inherit; color: #e7ecf5; background: #1a1f2c; border: 1px solid #2c3446;
           border-radius: 8px; padding: .4rem .7rem; cursor: pointer; }
  button:hover:not(:disabled) { background: #232a3a; border-color: #3d4761; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.go { background: #55e39b; border-color: #55e39b; color: #06251a; font-weight: 700; }
  .bar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  .bar .note { color: #7d8aa3; font-size: .72rem; }
  .bar .note.err { color: #ff8f8f; }
  .toggle.on { background: #2b3550; border-color: #55e39b; }

  .rows { display: grid; gap: .8rem; }
  .card { border: 1px solid #222838; border-radius: 12px; background: #10141d; overflow: hidden; }
  .top { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) auto; gap: .9rem; padding: .8rem; align-items: center; }
  .shot { width: 4.5rem; height: 4.5rem; border-radius: 8px; object-fit: cover; background: #1a1f2c; }
  .shot.none { display: grid; place-items: center; color: #46506a; font-size: .6rem; }
  .title { font-weight: 700; font-size: .95rem; overflow-wrap: anywhere; }
  .meta { color: #7d8aa3; font-size: .72rem; margin-top: .3rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .price { text-align: right; font-size: 1.25rem; font-weight: 700; white-space: nowrap; }
  .price s { display: block; font-size: .78rem; color: #7d8aa3; font-weight: 400; }
  .price .sold { color: #55e39b; }

  .chip { border-radius: 999px; padding: .1rem .5rem; font-size: .68rem; border: 1px solid; white-space: nowrap; }
  .chip.queued, .chip.publishing { color: #9fb0d5; border-color: #3d4761; }
  .chip.drafted { color: #ffcf6b; border-color: #6b5a2a; }
  .chip.live    { color: #55e39b; border-color: #2c6b4f; }
  .chip.failed, .chip.unlisted { color: #ff8f8f; border-color: #6b2c2c; }
  .chip.gone    { color: #6b7689; border-color: #2c3446; }
  .chip.sold    { color: #06251a; background: #55e39b; border-color: #55e39b; font-weight: 700; }

  .talk { border-top: 1px solid #222838; padding: .7rem .8rem .8rem; display: grid; gap: .8rem; }
  .thread { display: grid; gap: .25rem; }
  .who { color: #7d8aa3; font-size: .7rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .msg { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr) auto; gap: .6rem; align-items: baseline; padding: .15rem 0; }
  .msg .frm { font-size: .68rem; color: #7d8aa3; }
  .msg.seller .frm { color: #55e39b; }
  .msg .txt { overflow-wrap: anywhere; line-height: 1.45; }
  .msg .amt { font-weight: 700; white-space: nowrap; }
  .unsent { border-left: 2px solid #ffcf6b; padding-left: .5rem; margin-left: -.6rem; }
  .send { display: flex; gap: .5rem; align-items: center; margin-top: .3rem; }
  .send .why { color: #ffcf6b; font-size: .7rem; }
  .deal { color: #55e39b; font-size: .72rem; }
  .none { color: #6b7689; font-size: .75rem; }
  .empty { border: 1px dashed #222838; border-radius: 12px; padding: 2rem; text-align: center; color: #7d8aa3; line-height: 1.8; }
  @media (max-width: 640px) {
    .top { grid-template-columns: 3rem minmax(0, 1fr); }
    .price { grid-column: 2; text-align: left; }
    .shot { width: 3rem; height: 3rem; }
    .msg { grid-template-columns: 3.6rem minmax(0, 1fr); }
    .msg .amt { grid-column: 2; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Listings</h1>
      <div class="sub" id="sub">loading…</div>
    </div>
    <div class="totals">
      <span><b id="t-live">0</b>live</span>
      <span class="warn"><b id="t-waiting">0</b>waiting on you</span>
      <span><b id="t-talking">0</b>conversations</span>
      <span class="warn"><b id="t-unsent">0</b>unsent replies</span>
      <span><b id="t-sold">0</b>sold</span>
      <span><b id="t-value">$0</b>recovered</span>
    </div>
  </header>

  <div class="bar">
    <button id="sync" type="button">Check Facebook now</button>
    <button id="watch" class="toggle" type="button">Keep checking</button>
    <button id="auto" class="toggle" type="button">Auto-reply</button>
    <span class="note" id="tracker"></span>
  </div>

  <div class="rows" id="rows"></div>
  <p class="sub" style="margin-top:1.4rem"><a href="/">Live feed</a> · <a href="/dashboard">Dashboard</a></p>
</main>

<script>
// Where every listing stands and who is talking to us about it. One read of
// /api/status has all of it (docs/status-api.md); this page never talks to
// muse or Facebook itself, so it stays cheap to poll.
//
// The agent's replies are written by the seller policy against a limit set by
// the goal button. That limit is server-side and appears in no response, so
// nothing here can show a buyer how low we would go.
const $ = (id) => document.getElementById(id);
const usd = (n) => `$${Math.round(Number(n) || 0).toLocaleString("en-US")}`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clock = (ts) => (ts ? new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "");

// What a channel state means, said plainly rather than as a bare status word.
const FB = {
  queued: "building the draft…",
  drafted: "draft ready — press Publish in Facebook",
  live: "live on Marketplace",
  sold: "sold on Marketplace",
  failed: "could not build the draft",
  gone: "no longer on Facebook",
};
const SHOP = { publishing: "publishing…", live: "live", unlisted: "created but not on the storefront", failed: "not listed" };

let data = null;
let busy = false;

function channelLine(name, state, words) {
  if (!state || state.status === "off") return "";
  const link = state.url ? ` · <a href="${esc(state.url)}" target="_blank" rel="noopener">open</a>` : "";
  const detail = words[state.status] ?? state.status;
  return `<span class="chip ${esc(state.status)}">${esc(name)}</span><span>${esc(detail)}${link}</span>`;
}

// Only a Facebook thread has someone to deliver to. A reply in a thread that
// came through our own API was already answered in that API's response, so it
// is not "waiting to be sent" and must not offer a Send button.
function messageHtml(m, threadId, deliverable) {
  const pending = deliverable && m.frm === "SELLER" && m.sent === null;
  const failed = deliverable && m.frm === "SELLER" && m.sent === false;
  return `<div class="msg ${m.frm === "SELLER" ? "seller" : "buyer"}${pending || failed ? " unsent" : ""}">
      <span class="frm">${m.frm === "SELLER" ? "agent" : "buyer"}</span>
      <span class="txt">${esc(m.text)}${
        pending ? `<span class="send"><button type="button" data-send="${esc(threadId)}">Send to buyer</button><span class="why">written, not sent</span></span>`
        : failed ? `<span class="send"><button type="button" data-send="${esc(threadId)}">Try again</button><span class="why">could not be delivered</span></span>` : ""
      }</span>
      <span class="amt">${m.priceUsd === null || m.priceUsd === undefined ? "" : usd(m.priceUsd)}</span>
    </div>`;
}

function threadHtml(t) {
  const state = t.agreedUsd != null
    ? `<span class="deal">agreed at ${usd(t.agreedUsd)}</span>`
    : t.closed ? `<span class="none">closed, no deal</span>` : `<span class="none">talking</span>`;
  const facebook = t.channel === "facebook";
  return `<div class="thread">
    <div class="who"><span>${esc(t.buyer)}</span><span>· ${facebook ? "on Facebook" : "through the store"}</span>${state}</div>
    ${t.messages.map((m) => messageHtml(m, t.id, facebook)).join("")}
  </div>`;
}

function cardHtml(l) {
  const sold = l.status === "SOLD";
  const photo = l.photoUrl ? `<img class="shot" src="${esc(l.photoUrl)}" alt="" />` : `<div class="shot none">no photo</div>`;
  const threads = l.threads ?? [];
  return `<article class="card">
    <div class="top">
      ${photo}
      <div>
        <div class="title">${esc(l.title)}</div>
        <div class="meta">
          ${sold ? `<span class="chip sold">sold</span>` : ""}
          ${channelLine("Marketplace", l.marketplace, FB)}
          ${channelLine("Shopify", l.shopify, SHOP)}
        </div>
      </div>
      <div class="price">
        ${sold ? `<span class="sold">${usd(l.soldUsd)}</span><s>asked ${usd(l.listUsd)}</s>` : usd(l.listUsd)}
      </div>
    </div>
    <div class="talk">
      ${threads.length ? threads.map(threadHtml).join("") : `<span class="none">No messages yet.</span>`}
    </div>
  </article>`;
}

function render() {
  const t = data.totals ?? {};
  const rows = data.listings ?? [];
  $("t-live").textContent = t.live ?? 0;
  $("t-waiting").textContent = t.waiting_on_you ?? 0;
  $("t-talking").textContent = t.conversations ?? 0;
  $("t-unsent").textContent = t.unsent_replies ?? 0;
  $("t-sold").textContent = t.sold ?? 0;
  $("t-value").textContent = usd(t.recovered_usd ?? 0);
  $("sub").textContent = `${rows.length} listing${rows.length === 1 ? "" : "s"} · ${clock(new Date().toISOString())}`;

  const tr = data.tracker ?? {};
  $("watch").classList.toggle("on", Boolean(tr.watching));
  $("auto").classList.toggle("on", Boolean(tr.autoReply));
  $("sync").disabled = Boolean(tr.checking) || busy;
  $("sync").textContent = tr.checking ? "Checking Facebook…" : "Check Facebook now";
  const last = tr.last ?? {};
  $("tracker").className = "note" + (last.error ? " err" : "");
  $("tracker").textContent = last.error
    ? `last check failed: ${last.error}`
    : last.at ? `last checked ${clock(last.at)}` : "not checked yet";

  $("rows").innerHTML = rows.length
    ? rows.map(cardHtml).join("")
    : `<div class="empty">No listings yet.<br />Approve a plan on the <a href="/">live feed</a> — they show up here with whatever buyers say about them.</div>`;
}

async function refresh() {
  try {
    data = await (await fetch("/api/status", { cache: "no-store" })).json();
    render();
  } catch (err) {
    $("sub").textContent = "server unreachable";
  }
}

async function post(path, body) {
  busy = true;
  render();
  try {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body ?? {}),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
  } catch (err) {
    $("tracker").className = "note err";
    $("tracker").textContent = err.message;
  } finally {
    busy = false;
    await refresh();
  }
}

// A check asks muse to read the account and can take 30-90s, so the button
// locks and the page keeps polling while it runs.
$("sync").addEventListener("click", () => post("/api/status/sync"));
$("watch").addEventListener("click", () => post("/api/status/watch", { on: !data?.tracker?.watching, every_s: 120 }));
$("auto").addEventListener("click", () => post("/api/status/auto-reply", { on: !data?.tracker?.autoReply }));

// Sending is the one thing here that reaches a real person from the owner's
// own account, so it is always a deliberate press.
$("rows").addEventListener("click", (e) => {
  const threadId = e.target.closest("[data-send]")?.dataset.send;
  if (!threadId) return;
  e.target.disabled = true;
  post(`/api/status/threads/${encodeURIComponent(threadId)}/send`);
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
